# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric — 1.20.1 branch.
# This is the last Minecraft version with a native Create Fabric build, which is why the
# port targets it: Create runs without Sinytra Connector, so the live integration talks to
# the mod directly instead of through a compatibility layer.
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.19.3
loom_version=1.7.4

# Mod
mod_version=1.0.0
maven_group=com.gadzo
archives_base_name=gadzo-client

# Dependencies
fabric_api_version=0.92.11+1.20.1
